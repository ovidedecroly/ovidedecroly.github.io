{% extends "base.html" %}

{% block content %}
<section class="page-banner">
  <div class="container narrow">
    <span class="eyebrow">Academic Biography & Lab Info</span>
    <h1>{{ section.title }}</h1>
    {% if section.description %}
      <p class="page-lead">{{ section.description }}</p>
    {% endif %}
  </div>
</section>

<section class="article-container container narrow">
  <div class="article-content">
    {{ section.content | safe }}
  </div>
</section>
{% endblock content %}
