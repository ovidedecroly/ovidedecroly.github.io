{% extends "base.html" %}

{% block content %}
<section class="page-banner">
  <div class="container">
    <span class="eyebrow">{{ config.title }}</span>
    <h1>{{ section.title }}</h1>
    {% if section.description %}<p class="page-lead">{{ section.description }}</p>{% endif %}
  </div>
</section>

<section class="section">
  <div class="container cards-grid">
    {% for page in section.pages %}
      {% include "partials/article-card.html" %}
    {% endfor %}
  </div>
</section>
{% endblock content %}
