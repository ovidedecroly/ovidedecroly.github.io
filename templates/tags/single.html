{% extends "base.html" %}

{% block content %}
<section class="page-banner">
  <div class="container">
    <span class="eyebrow">Tag Topic</span>
    <h1>#{{ term.name }}</h1>
    <p class="page-lead">{{ term.pages | length }} item(s) tagged under this technical topic.</p>
  </div>
</section>

<section class="section">
  <div class="container cards-grid">
    {% for page in term.pages %}
      {% include "partials/article-card.html" %}
    {% endfor %}
  </div>
</section>
{% endblock content %}
