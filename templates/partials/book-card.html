<article class="book-card">
  <div class="book-cover-wrap">
    {% if page.extra.cover %}
      <img class="book-cover-img" src="{{ page.extra.cover }}" alt="Cover for {{ page.title }}">
    {% else %}
      <div style="font-size: 2.5rem; color: var(--green-600);">📖</div>
    {% endif %}
  </div>

  <div class="book-info-wrap">
    {% if page.extra.status %}
      <span class="book-status-tag">{{ page.extra.status }}</span>
    {% endif %}

    <h3>
      <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    </h3>

    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}

    <div class="book-card-actions">
      <a class="btn small secondary" href="{{ page.permalink | safe }}">Details &rarr;</a>

      {% if page.extra.pdf %}
        <a class="btn small primary" href="{{ page.extra.pdf }}" target="_blank" rel="noopener">📄 Download PDF</a>
      {% endif %}
    </div>
  </div>
</article>
